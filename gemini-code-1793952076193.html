<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>데일리락 (Daily Lock)</title>
  <link rel="apple-touch-icon" href="https://fav.farm/🔒">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-exercise: #4ade80;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* App Bar */
    header { background: #1e293b; padding: 16px; text-align: center; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header button { background: none; border: none; color: var(--accent); font-size: 0.9rem; cursor: pointer; }
    
    /* Navigation Bar */
    nav { position: fixed; bottom: 0; width: 100%; background: var(--card-bg); display: flex; border-top: 1px solid var(--border); z-index: 100; }
    nav button { flex: 1; padding: 14px 0; background: none; border: none; color: var(--text-sub); font-size: 0.85rem; font-weight: 600; }
    nav button.active { color: var(--accent); border-top: 2px solid var(--accent); }
    
    /* Tab Views */
    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }
    
    /* Common UI Cards */
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
    .card-title { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 8px; }
    
    /* Structured Timeline */
    .block-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 8px; background: #0f172a; margin-bottom: 8px; border-left: 4px solid var(--accent); }
    .block-item.exercise { border-left-color: var(--accent-exercise); }
    .block-item.current { background: #1e3a8a; border-left-width: 6px; }
    .block-time { font-size: 0.8rem; color: var(--text-sub); }
    .block-name { font-size: 1rem; font-weight: bold; margin-top: 2px; }
    .btn-start { background: var(--accent); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    /* Timer UI */
    .timer-display { font-size: 3.5rem; font-weight: bold; text-align: center; margin: 24px 0; font-family: monospace; color: var(--accent); }
    .input-memo { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 16px; font-size: 0.95rem; }
    .btn-group { display: flex; gap: 8px; }
    .btn-group button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-complete { background: var(--accent); color: #000; }
    .btn-stop { background: var(--danger); color: #fff; }
    
    /* Config Modal */
    #config-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); padding: 20px; z-index: 200; justify-content: center; align-items: center; }
    #config-modal .card { width: 100%; max-width: 400px; }
    input[type="text"] { width: 100%; padding: 10px; margin: 8px 0 16px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
  </style>
</head>
<body>

  <header>
    <span>데일리락 (DailyLock)</span>
    <button onclick="openConfig()">설정</button>
  </header>

  <!-- 오늘 탭 -->
  <main id="tab-today" class="tab-content active">
    <div class="card">
      <div class="card-title">이번 주 운동 횟수</div>
      <h2 id="weekly-exercise-count" style="color: var(--accent-exercise);">0 / 4 회</h2>
    </div>
    
    <div class="card-title">오늘의 타임라인</div>
    <div id="timeline-container">
      <!-- 동적 생성됨 -->
    </div>
  </main>

  <!-- 집중(타이머) 탭 -->
  <main id="tab-focus" class="tab-content">
    <div class="card" style="text-align: center;">
      <div id="focus-subject" class="card-title" style="font-size: 1.2rem; color: #fff;">과목 선택 없음</div>
      <div id="timer-display" class="timer-display">00:00</div>
      <input type="text" id="memo-input" class="input-memo" placeholder="오늘 어디까지 공부했는지 1줄 메모" maxLength="50">
      <div class="btn-group">
        <button class="btn-stop" onclick="stopTimer(false)">중단</button>
        <button class="btn-complete" onclick="stopTimer(true)">완료</button>
      </div>
    </div>
  </main>

  <!-- 계획 탭 -->
  <main id="tab-plan" class="tab-content">
    <div class="card">
      <div class="card-title">주간 공부 시간목표</div>
      <ul style="list-style: none; line-height: 1.8; font-size: 0.95rem;">
        <li>• 6시그마 그린벨트: 7시간 (360분/60분)</li>
        <li>• 품질경영기사: 6시간 (120분/240분)</li>
        <li>• 영어 회화: 2시간 30분 (150분)</li>
      </ul>
    </div>
    <div class="card-title">등록된 블록 (스프레드시트 동기화)</div>
    <div id="schedule-list-container"></div>
  </main>

  <!-- 기록 탭 -->
  <main id="tab-log" class="tab-content">
    <div class="card">
      <div class="card-title">최근 공부/운동 기록</div>
      <div id="logs-container">
        <!-- 동적 생성됨 -->
      </div>
    </div>
  </main>

  <!-- 하단 탭 바 -->
  <nav>
    <button class="active" onclick="switchTab('today', this)">오늘</button>
    <button onclick="switchTab('focus', this)">집중</button>
    <button onclick="switchTab('plan', this)">계획</button>
    <button onclick="switchTab('log', this)">기록</button>
  </nav>

  <!-- 설정 모달 -->
  <div id="config-modal">
    <div class="card">
      <h3>설정</h3>
      <label style="font-size: 0.8rem; color: var(--text-sub);">Google Apps Script 웹 앱 URL</label>
      <input type="text" id="gas-url-input" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="btn-start" style="width:100%; padding: 10px;" onclick="saveConfig()">저장 및 동기화</button>
    </div>
  </div>

  <script>
    let config = {
      gasUrl: localStorage.getItem('gasUrl') || ''
    };
    
    let currentSchedule = [];
    let timerInterval = null;
    let secondsLeft = 0;
    let currentSubject = '';
    let targetDuration = 0;

    const days = ['일', '월', '화', '수', '목', '금', '토'];

    window.onload = () => {
      if (!config.gasUrl) {
        openConfig();
      } else {
        loadData();
      }
    };

    function openConfig() {
      document.getElementById('gas-url-input').value = config.gasUrl;
      document.getElementById('config-modal').style.display = 'flex';
    }

    function saveConfig() {
      config.gasUrl = document.getElementById('gas-url-input').value.trim();
      localStorage.setItem('gasUrl', config.gasUrl);
      document.getElementById('config-modal').style.display = 'none';
      loadData();
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      if (el) el.classList.add('active');
    }

    async function loadData() {
      if (!config.gasUrl) return;
      try {
        const res = await fetch(`${config.gasUrl}?action=getSchedule`);
        const json = await res.json();
        if (json.status === 'success') {
          currentSchedule = json.data;
          renderToday();
          renderPlan();
        }
        loadLogs();
      } catch (err) {
        console.error("데이터 로드 실패", err);
      }
    }

    function renderToday() {
      const todayDay = days[new Date().getDay()];
      const nowStr = new Date().toTimeString().substring(0, 5);
      const container = document.getElementById('timeline-container');
      container.innerHTML = '';

      const todayBlocks = currentSchedule.filter(s => s.day === todayDay);

      if (todayBlocks.length === 0) {
        container.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding: 20px;">오늘 예정된 일정이 없습니다.</div>';
        return;
      }

      todayBlocks.forEach(b => {
        const isCurrent = nowStr >= b.startTime && nowStr <= b.endTime;
        const el = document.createElement('div');
        el.className = `block-item ${b.type === 'exercise' ? 'exercise' : ''} ${isCurrent ? 'current' : ''}`;
        el.innerHTML = `
          <div>
            <div class="block-time">${b.startTime} ~ ${b.endTime} (${b.duration}분)</div>
            <div class="block-name">${b.subject}</div>
          </div>
          <button class="btn-start" onclick="startFocus('${b.subject}', ${b.duration})">시작</button>
        `;
        container.appendChild(el);
      });
    }

    function startFocus(subject, durationMinutes) {
      currentSubject = subject;
      targetDuration = durationMinutes;
      secondsLeft = durationMinutes * 60;
      
      document.getElementById('focus-subject').innerText = `${subject} (${durationMinutes}분)`;
      updateTimerDisplay();
      
      switchTab('focus', document.querySelectorAll('nav button')[1]);

      // 아이폰 단축어 Scheme 실행 (iOS 앱 차단/타이머 연동)
      // 단축어 이름: "DailyLockStart"
      window.location.href = `shortcuts://run-shortcut?name=DailyLockStart&input=${durationMinutes}`;

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay();
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          alert('설정한 시간이 완료되었습니다! 메모를 남기고 완료 처리를 하세요.');
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
      const s = (secondsLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `${m}:${s}`;
    }

    async function stopTimer(isComplete) {
      if (!currentSubject) return;
      clearInterval(timerInterval);
      
      const memo = document.getElementById('memo-input').value;
      const payload = {
        action: 'saveLog',
        subject: currentSubject,
        duration: targetDuration,
        memo: memo,
        status: isComplete ? '완료' : '중단'
      };

      try {
        await fetch(config.gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        alert(isComplete ? '완료 처리되었습니다.' : '중단 기록이 저장되었습니다.');
      } catch (e) {
        alert('저장 중 오류 발생');
      }

      // 초기화
      document.getElementById('memo-input').value = '';
      currentSubject = '';
      switchTab('today', document.querySelectorAll('nav button')[0]);
      loadLogs();
    }

    function renderPlan() {
      const container = document.getElementById('schedule-list-container');
      container.innerHTML = '';
      currentSchedule.forEach(s => {
        const item = document.createElement('div');
        item.className = 'card';
        item.style.padding = '10px';
        item.style.fontSize = '0.9rem';
        item.innerText = `[${s.day}] ${s.startTime}~${s.endTime} | ${s.subject} (${s.duration}분)`;
        container.appendChild(item);
      });
    }

    async function loadLogs() {
      if (!config.gasUrl) return;
      try {
        const res = await fetch(`${config.gasUrl}?action=getLogs`);
        const json = await res.json();
        if (json.status === 'success') {
          const container = document.getElementById('logs-container');
          container.innerHTML = '';
          
          let exCount = 0;
          json.data.reverse().forEach(log => {
            if (log.subject === '운동' && log.status === '완료') exCount++;
            const item = document.createElement('div');
            item.style.borderBottom = '1px solid var(--border)';
            item.style.padding = '8px 0';
            item.innerHTML = `
              <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:var(--text-sub);">
                <span>${log.date} | ${log.subject}</span>
                <span style="color:${log.status === '완료' ? 'var(--accent)' : 'var(--danger)'}">${log.status} (${log.duration}분)</span>
              </div>
              <div style="font-size:0.9rem; margin-top:4px;">${log.memo || '메모 없음'}</div>
            `;
            container.appendChild(item);
          });
          document.getElementById('weekly-exercise-count').innerText = `${exCount} / 4 회`;
        }
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>
</html>
